name: Diagnóstico de staging

# Revisa que la tienda pública pueda leer los datos de staging (sin mostrar claves).
on:
  workflow_dispatch:

jobs:
  diagnostico:
    name: Diagnóstico
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_REGION: ${{ vars.SUPABASE_REGION || 'ca-central-1' }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Base de datos
        run: |
          sudo apt-get install -y -qq postgresql-client > /dev/null
          PASS=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          echo "::add-mask::$PASS"
          URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${PASS}@aws-1-${SUPABASE_REGION}.pooler.supabase.com:5432/postgres?sslmode=require"
          echo "::add-mask::$URL"
          R=$(psql "$URL" -Atc "select string_agg(s.slug||':'||s.status||':'||coalesce(d.hostname,'-')||':'||coalesce(d.verified_at::text,'sin-verificar'), ' | ') from public.stores s left join public.store_domains d on d.store_id=s.id")
          echo "::notice title=Tiendas y dominios::$R"
          V=$(psql "$URL" -Atc "select count(*) from storefront.domains")
          echo "::notice title=Filas en storefront.domains (como postgres)::$V"
          G=$(psql "$URL" -Atc "select has_schema_privilege('anon','storefront','USAGE')||' / '||has_table_privilege('anon','storefront.domains','SELECT')")
          echo "::notice title=Permisos anon (schema / domains)::$G"
          A=$(psql "$URL" -Atc "set role anon; select count(*) from storefront.domains" 2>&1 | tail -1)
          echo "::notice title=Filas visibles como anon::$A"
      - name: API pública
        run: |
          KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next(k["api_key"] for k in d if k.get("name")=="anon"))')
          echo "::add-mask::$KEY"
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co"
          OUT=$(curl -s -w ' HTTP=%{http_code}' "$BASE/rest/v1/domains?select=hostname" -H "apikey: $KEY" -H "Accept-Profile: storefront")
          echo "::notice title=API storefront.domains::${OUT:0:600}"
          OUT2=$(curl -s -o /dev/null -w '%{http_code}' https://tiendas-storefront.vercel.app/)
          echo "::notice title=Vercel tienda::HTTP $OUT2"
