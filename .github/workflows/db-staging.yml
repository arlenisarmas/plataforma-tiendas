name: Base de datos staging

# Aplica las migraciones al proyecto Supabase de staging al integrar en main.
# Si los secretos todavía no están cargados, se saltea con un aviso (no falla).
# Secretos necesarios (los carga Arle en GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: db-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrar staging
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Verificar secretos
        id: secretos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Staging todavía no está configurado (faltan secretos). Se saltea la migración."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secretos.outputs.listo == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secretos.outputs.listo == 'true'
        with:
          version: 2.121.0
      - name: Aplicar migraciones
        if: steps.secretos.outputs.listo == 'true'
        run: |
          # Si algo falla, el motivo queda como anotación del job (los secretos se enmascaran solos).
          set -o pipefail
          fallo() { echo "::error title=$1::$(tail -15 salida.txt | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee salida.txt || fallo "supabase link"
          supabase db push --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee salida.txt || fallo "supabase db push"
          echo "::notice title=Staging::Migraciones aplicadas"
