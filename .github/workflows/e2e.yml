name: Recorridos e2e (Supabase local)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  critical-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: pnpm install --frozen-lockfile
      - name: Levantar Supabase y aplicar migraciones y seed
        run: |
          supabase start
          supabase db reset --local
      - name: Preparar variables locales efímeras
        run: |
          supabase status -o env > supabase-local.env
          set -a
          . ./supabase-local.env
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_ADMIN_URL=http://localhost:3001" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_STOREFRONT_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_PLATFORM_DOMAIN=localhost" >> "$GITHUB_ENV"
          echo "CART_COOKIE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PREVIEW_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "REVALIDATE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          rm supabase-local.env
      - run: pnpm --filter @plataforma/admin exec playwright install --with-deps chromium
      - name: Probar seis recorridos en móvil y escritorio
        run: pnpm --filter @plataforma/admin exec playwright test e2e/critical-flows.pw.ts --reporter=github,list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: apps/admin/test-results
